name: EC2 Docker Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'
      - '.github/workflows/ec2-deploy.yml'

jobs:
  deploy-to-ec2-docker:
    name: Deploy Dockerized Backend & Database to AWS EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via Docker Compose on EC2
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_DEPLOY_USER }}@${{ secrets.EC2_HOST }}" "bash -s" << 'EOF'
            set -euo pipefail
            APP_DIR="/var/www/whatsapp-voice"
            
            if [ ! -d "${APP_DIR}" ]; then
              sudo mkdir -p "${APP_DIR}"
              sudo chown -R $USER:$USER "${APP_DIR}"
            fi

            cd "${APP_DIR}"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all --tags
              git checkout -f origin/main
              git pull --ff-only || true
            fi

            # Ensure .env file exists on EC2 host
            if [ ! -f .env ]; then
              echo "Creating .env from secrets..."
              cat << ENV_EOF > .env
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_ALLOWED_HOSTS=${{ secrets.EC2_HOST }},localhost,127.0.0.1
            DEBUG=False
            POSTGRES_DB=whatsapp_voice
            POSTGRES_USER=wv_app_user
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ENV_EOF
            fi

            # Build and restart containers using Docker Compose
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Wait for backend healthcheck
            echo "Waiting for backend services to stabilize..."
            sleep 8
            docker compose ps
          EOF

      - name: Verify Live Production Health Probe
        run: |
          curl -f --retry 5 --retry-delay 3 \
            "http://${{ secrets.EC2_HOST }}/api/v1/health/" || curl -f --retry 3 --retry-delay 3 -k "https://${{ secrets.EC2_HOST }}/api/v1/health/"
