services:
  db:
    image: postgres:16-alpine
    container_name: wv_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_voice}
      POSTGRES_USER: ${POSTGRES_USER:-wv_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Port 5432 is NEVER exposed publicly

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wv_django_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_voice}
      POSTGRES_USER: ${POSTGRES_USER:-wv_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - backend_net
      - frontend_net

  nginx:
    image: nginx:alpine
    container_name: wv_nginx_proxy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_data:/var/www/certbot:ro
    networks:
      - frontend_net

volumes:
  postgres_data:
    name: wv_postgres_data
  static_volume:
    name: wv_static_volume
  media_volume:
    name: wv_media_volume
  certbot_data:
    name: wv_certbot_data

networks:
  backend_net:
    internal: true
  frontend_net:
    driver: bridge
